server:
  port: 8086

spring:
  application:
    name: notification-service
  datasource:
    url: jdbc:postgresql://${NOTIFICATION_DB_HOST:localhost}:${NOTIFICATION_DB_PORT:5405}/notification_db
    username: ${NOTIFICATION_DB_USERNAME:notification-db-username}
    password: ${NOTIFICATION_DB_PASSWORD:notification-db-password}
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yml
  kafka:
    bootstrap-servers: ${KAFKA_HOST:localhost}:9092
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      group-id: payment-service-group
      properties:
        spring.json.trusted.packages: "*"
        spring.json.type.mapping: >
          orderConfirmedEvent:org.project.notificationservice.event.OrderConfirmedEvent,
          userRegisteredEvent:org.project.notificationservice.event.UserRegisteredEvent

kafka:
  topics:
    orders-confirmed: orders-confirmed
    users-registered: users-registered
