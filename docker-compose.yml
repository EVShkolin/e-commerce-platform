services:
  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    container_name: user-service
    ports:
      - "8081:8081"
    environment:
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      MONGO_USERNAME: ${MONGO_USERNAME}
      MONGO_PASSWORD: ${MONGO_PASSWORD}
      KAFKA_HOST: kafka
    depends_on:
      - mongo
      - kafka
    networks:
      - app-network

  mongo:
    image: mongo:6
    container_name: mongo_db
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    networks:
      - app-network
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb

  mongo-express:
    image: mongo-express
    container_name: mongo_express
    ports:
      - "8091:8081"
    environment:
      ME_CONFIG_BASICAUTH_USERNAME: ${ME_USERNAME}
      ME_CONFIG_BASICAUTH_PASSWORD: ${ME_PASSWORD}
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_USERNAME}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_PASSWORD}
      ME_CONFIG_MONGODB_SERVER: mongo_db
    depends_on:
      - mongo
    networks:
      - app-network

  product-catalog-service:
    build:
      context: ./product-catalog-service
      dockerfile: Dockerfile
    container_name: product-catalog-service
    ports:
      - "8082:8082"
    environment:
      PRODUCT_DB_HOST: product_db
      PRODUCT_DB_PORT: 5401
      PRODUCT_DB_USERNAME: ${PRODUCT_DB_USERNAME}
      PRODUCT_DB_PASSWORD: ${PRODUCT_DB_PASSWORD}
    depends_on:
      - product_db
    networks:
      - app-network

  product_db:
    image: bitnami/postgresql:latest
    container_name: product_db
    ports:
      - "5401:5401"
    environment:
      POSTGRESQL_PORT_NUMBER: 5401
      POSTGRESQL_DATABASE: product_db
      POSTGRESQL_USERNAME: ${PRODUCT_DB_USERNAME}
      POSTGRESQL_PASSWORD: ${PRODUCT_DB_PASSWORD}
    networks:
      - app-network
    volumes:
      - product-db-data:/bitnami/postgresql
      - tmp1:/docker-entrypoint-initdb.d
      - tmp1:/docker-entrypoint-preinitdb.d

  shopping-cart-service:
    build:
      context: ./shopping-cart-service
      dockerfile: Dockerfile
    container_name: shopping-cart-service
    ports:
      - "8083:8083"
    environment:
      CART_DB_HOST: cart_db
      CART_DB_PORT: 5402
      CART_DB_USERNAME: ${CART_DB_USERNAME}
      CART_DB_PASSWORD: ${CART_DB_PASSWORD}
      PRODUCT_CATALOG_BASE_URL: ${PRODUCT_CATALOG_BASE_URL}
      KAFKA_HOST: kafka
    depends_on:
      - cart_db
    networks:
      - app-network

  cart_db:
    image: bitnami/postgresql:latest
    container_name: cart_db
    ports:
      - "5402:5402"
    environment:
      POSTGRESQL_PORT_NUMBER: 5402
      POSTGRESQL_DATABASE: cart_db
      POSTGRESQL_USERNAME: ${CART_DB_USERNAME}
      POSTGRESQL_PASSWORD: ${CART_DB_PASSWORD}
    networks:
      - app-network
    volumes:
      - cart-db-data:/bitnami/postgresql
      - tmp1:/docker-entrypoint-initdb.d
      - tmp1:/docker-entrypoint-preinitdb.d

  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    container_name: order-service
    ports:
      - "8084:8084"
    environment:
      ORDER_DB_HOST: order_db
      ORDER_DB_PORT: 5403
      ORDER_DB_USERNAME: ${ORDER_DB_USERNAME}
      ORDER_DB_PASSWORD: ${ORDER_DB_PASSWORD}
      SHOPPING_CART_BASE_URL: ${SHOPPING_CART_BASE_URL}
      PAYMENT_BASE_URL: ${PAYMENT_BASE_URL}
      USER_BASE_URL: ${USER_BASE_URL}
      KAFKA_HOST: kafka
    depends_on:
      - order_db
      - kafka
    networks:
      - app-network

  order_db:
    image: bitnami/postgresql:latest
    container_name: order_db
    ports:
      - "5403:5403"
    environment:
      POSTGRESQL_PORT_NUMBER: 5403
      POSTGRESQL_DATABASE: order_db
      POSTGRESQL_USERNAME: ${ORDER_DB_USERNAME}
      POSTGRESQL_PASSWORD: ${ORDER_DB_PASSWORD}
    networks:
      - app-network
    volumes:
      - order-db-data:/bitnami/postgresql
      - tmp1:/docker-entrypoint-initdb.d
      - tmp1:/docker-entrypoint-preinitdb.d

  payment_service:
    build:
      context: ./payment-service
      dockerfile: Dockerfile
    container_name: payment-service
    ports:
      - "8085:8085"
    environment:
      PAYMENT_DB_HOST: payment_db
      PAYMENT_DB_PORT: 5404
      PAYMENT_DB_USERNAME: ${PAYMENT_DB_USERNAME}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      KAFKA_HOST: kafka
    depends_on:
      - payment_db
    networks:
      - app-network

  payment_db:
    image: bitnami/postgresql:latest
    container_name: payment_db
    ports:
      - "5404:5404"
    environment:
      POSTGRESQL_PORT_NUMBER: 5404
      POSTGRESQL_DATABASE: payment_db
      POSTGRESQL_USERNAME: ${PAYMENT_DB_USERNAME}
      POSTGRESQL_PASSWORD: ${PAYMENT_DB_PASSWORD}
    networks:
      - app-network
    volumes:
      - payment-db-data:/bitnami/postgresql
      - tmp1:/docker-entrypoint-initdb.d
      - tmp1:/docker-entrypoint-preinitdb.d

  notification_service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    container_name: notification-service
    ports:
      - "8086:8086"
    environment:
      NOTIFICATION_DB_HOST: notification_db
      NOTIFICATION_DB_PORT: 5405
      NOTIFICATION_DB_USERNAME: ${NOTIFICATION_DB_USERNAME}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
      KAFKA_HOST: kafka
      RESEND_API_KEY: ${RESEND_API_KEY}
    depends_on:
      - notification_db
    networks:
      - app-network

  notification_db:
    image: bitnami/postgresql:latest
    container_name: notification_db
    ports:
      - "5405:5405"
    environment:
      POSTGRESQL_PORT_NUMBER: 5405
      POSTGRESQL_DATABASE: notification_db
      POSTGRESQL_USERNAME: ${NOTIFICATION_DB_USERNAME}
      POSTGRESQL_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
    networks:
      - app-network
    volumes:
      - notification-db-data:/bitnami/postgresql
      - tmp1:/docker-entrypoint-initdb.d
      - tmp1:/docker-entrypoint-preinitdb.d

  kafka:
    image: bitnami/kafka:latest
    container_name: kafka
    ports:
      - "9092:29092"
    environment:
      KAFKA_ENABLE_KRAFT: "yes"
      KAFKA_CFG_PROCESS_ROLES: "broker,controller"
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CFG_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093, PLAINTEXT_HOST://:29092"
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9092"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    networks:
      - app-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8090:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092
    depends_on:
      - kafka
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mongo-data:
  mongo-config:
  product-db-data:
  cart-db-data:
  order-db-data:
  payment-db-data:
  notification-db-data:
  tmp1:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs