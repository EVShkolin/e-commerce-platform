server:
  port: 8085

spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:postgresql://${PAYMENT_DB_HOST:localhost}:${PAYMENT_DB_PORT:5404}/payment_db
    username: ${PAYMENT_DB_USERNAME:payment-db-username}
    password: ${PAYMENT_DB_PASSWORD:payment-db-password}
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yml
  jpa:
    show-sql: true
  kafka:
    bootstrap-servers: ${KAFKA_HOST:localhost}:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.type.mapping: orderPaidEvent:org.project.paymentservice.event.OrderPaidEvent

stripe:
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:secret}

kafka:
  topics:
    orders-paid: orders-paid