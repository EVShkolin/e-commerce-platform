server:
  port: 8083

spring:
  application:
    name: shopping-cart-service
  datasource:
    url: jdbc:postgresql://${CART_DB_HOST:localhost}:${CART_DB_PORT:5402}/cart_db
    username: ${CART_DB_USERNAME:cart-db-username}
    password: ${CART_DB_PASSWORD:cart-db-password}
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yml
  kafka:
    bootstrap-servers: ${KAFKA_HOST:localhost}:9092
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      group-id: cart-service-group
      properties:
        spring.json.trusted.packages: "*"
        spring.json.type.mapping: cartClearEvent:org.project.shoppingcartservice.event.CartClearEvent

kafka:
  topics:
    carts-cleared: carts-cleared

service:
  product-catalog:
    base-url: ${PRODUCT_CATALOG_BASE_URL:http://localhost:8082/api/v1/products}